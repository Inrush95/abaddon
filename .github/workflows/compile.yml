name: Compile Official 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: uowuo/abaddon
          submodules: recursive
          set-safe-directory: true

      - name: Setup Windows MSVC Build Environment
        uses: microsoft/setup-msbuild@v2

      - name: Install 32-bit Desktop Dependencies via vcpkg
        shell: cmd
        run: |
          # Force vcpkg to install native 32-bit windows libraries cleanly
          vcpkg install curl:x86-windows zlib:x86-windows sqlite3:x86-windows openssl:x86-windows libsodium:x86-windows opus:x86-windows spdlog:x86-windows nlohmann-json:x86-windows gtkmm:x86-windows

      - name: Compile 32-bit Desktop Binary
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -A Win32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ..
          cmake --build . --config Release

      - name: Upload Completed 32-bit Executable
        uses: actions/upload-artifact@v4
        with:
          name: official-abaddon-win32-completed
          path: build/Release/abaddon.exe
          
