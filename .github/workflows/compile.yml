name: Compile 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Official Code
        uses: actions/checkout@v4
        with:
          repository: uowuo/abaddon
          submodules: recursive
          set-safe-directory: true

      - name: Setup Windows MSVC Compiler
        uses: microsoft/setup-msbuild@v2

      - name: Fetch Pre-Compiled 32bit Dependencies
        shell: powershell
        run: |
          # 1. Download Header-Only JSON
          New-Item -ItemType Directory -Force -Path .\include
          Invoke-WebRequest -Uri "https://github.com" -OutFile ".\include\json.hpp"
          
          # 2. Download and Silently Install Pre-Compiled Win32 GTK Runtime Stacks
          Invoke-WebRequest -Uri "https://github.com" -OutFile "gtk_installer.exe"
          Start-Process -FilePath ".\gtk_installer.exe" -ArgumentList "/S /D=C:\gtk3" -Wait

      - name: Compile Standalone 32bit Binary
        shell: cmd
        run: |
          mkdir build
          cd build
          set "GTK_BASEPATH=C:\gtk3"
          set "PATH=C:\gtk3\bin;%PATH%"
          cmake -A Win32 -DCMAKE_BUILD_TYPE=Release -DGTK3_DIR=C:/gtk3 -Dnlohmann_json_DIR=../include -DNLOHMANN_JSON_INCLUDE_DIR=../include ..
          cmake --build . --config Release

      - name: Bundle Executable For Windows 7
        shell: cmd
        run: |
          mkdir dist
          cp build/Release/abaddon.exe dist/
          # Collect the necessary visual elements so it opens out-of-the-box
          cp C:\gtk3\bin\*.dll dist\ 2>nul || true

      - name: Upload Completed Zip File
        uses: actions/upload-artifact@v4
        with:
          name: official-abaddon-win32-completed
          path: dist/
          
