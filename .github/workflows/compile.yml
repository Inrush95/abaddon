name: Abaddon CI
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true

      - name: Setup 32-bit MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-gtkmm3
            mingw-w64-i686-libsodium
            mingw-w64-i686-opus
            mingw-w64-i686-spdlog
            mingw-w64-i686-fmt
            mingw-w64-i686-libxml2
            mingw-w64-i686-json-glib
            mingw-w64-i686-nlohmann-json

      - name: Compile 32-bit Application
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          make -j2

      - name: Smart Package and Bundle DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/abaddon.exe dist/
          
          # Smart copy: Grabs whatever version of libfmt and libxml2 exist in the 32-bit directory automatically!
          cp /mingw32/bin/libfmt-*.dll dist/ 2>/dev/null || cp /mingw32/bin/fmt-*.dll dist/
          cp /mingw32/bin/libxml2-*.dll dist/
          
          # Copy remaining core UI dependencies
          cp /mingw32/bin/libgtk-3-*.dll dist/
          cp /mingw32/bin/libgtkmm-3.0-*.dll dist/
          cp /mingw32/bin/libsodium-*.dll dist/
          cp /mingw32/bin/libopus-*.dll dist/

      - name: Upload Working 32-bit Abaddon Bundle
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-windows-32bit-complete
          path: dist/
          
