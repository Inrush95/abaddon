name: Compile 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code and Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true

      - name: Setup Windows MSVC Build Environment
        uses: microsoft/setup-msbuild@v2

      - name: Inject Missing JSON Framework
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\include
          Invoke-WebRequest -Uri "https://github.com" -OutFile ".\include\json.hpp"

      - name: Install 32-bit CURL and ZLIB Dependencies
        shell: cmd
        run: |
          vcpkg install curl:x86-windows zlib:x86-windows

      - name: Compile 32-bit Desktop Binary
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -A Win32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -Dnlohmann_json_DIR=../include -DNLOHMANN_JSON_INCLUDE_DIR=../include ..
          cmake --build . --config Release

      - name: Upload Completed 32-bit Executable
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-windows-32bit
          path: build/Release/abaddon.exe
          
